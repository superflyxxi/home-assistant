blueprint:
  name: Dynamic HVAC Room Manager Automation
  description: >
    Monitors presence, schedules, sleep status, and temperature to automatically set 
    HVAC modes and setpoints for a single specified area.
  domain: automation
  input:
    target_climate:
      name: Target climate
      description: The target climate control to set.
      selector:
        entity:
          domain: climate
    enable_guest:
      name: Enable Guest Mode
      description: When enabled and Guest mode is activated, the target climate will not change.
      default: false
      selector:
        boolean: {}
    target_temp_action:
      name: Action On Reaching Target Temperature
      description: When the target temperature is reached, determine what action to take. Auto, let it run as is. Turn Off, turn off the climate; this is useful for rooms where the blowing of air can feel uncomfortable. Quiet Fan, change the fan mode to quiet.
      default: "Auto"
      selector:
        select:
          options:
            - "Auto"
            - "Turn Off"
            #- "Quiet Fan"
    target_temp_action_buffer:
      name: Target Temperation Action Buffer
      description: The degrees buffer in which to perform the target action.
      default: 0.0
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          mode: slider              # Options: "slider" or "box"
    enable_temp_action_sleep:
      name: Enable Target Temperature Action on Sleep
      description: When enabled, the target climate will not change when sleeping.
      default: false
      selector:
        boolean: {}
    home_persons:
      name: Home Persons
      description: Select persons required to be "home" for active HVAC mode (if none are home, defaults to inactive).
      default: []
      selector:
        entity:
          domain: person
          multiple: true
    required_entities:
      name: Required Entities
      description: Entities that when any are "on" will result in the room being active.
      selector:
        entity:
          multiple: true
    active_entities:
      name: Active Entities
      description: Once Required Entities conditions are met and any of these Active Entities are "on", the climate will be active.
      default: []
      selector:
        entity:
          multiple: true
    sleeping_sensors:
      name: Sleeping Sensors
      description: Select sleeping sensors that determine whether anyone in the room is sleeping (sensor "on") and to set target sleep temperatures.
      default: []
      selector:
        entity:
          multiple: true
    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      description: Sensor used to monitor current outdoor temperature to determine heat/cool/mid modes.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    hvac_mode_select:
      name: HVAC Mode Input Select
      description: The input select controlling the automation mode (Off, Auto, Guest, Away, Home).
      selector:
        entity:
          domain: input_select
    other_trigger:
      name: Other Trigger
      description: Any other trigger like time of day or other schedule.
      default: []
      selector:
        trigger: {}
    hot_weather_temp:
      name: Hot Weather Temperature Threshold
      description: Input number defining the threshold above which cooling is activated.
      selector:
        entity:
          domain: input_number
    cold_weather_temp:
      name: Cold Weather Temperature Threshold
      description: Input number defining the threshold below which heating is activated.
      selector:
        entity:
          domain: input_number
    default_heat_active_temp:
      name: Default Heat Active Temperature
      description: The desired target temperature when heating and active.
      default: 68
      selector:
        number:
          min: 60
          max: 75
          step: 1
          unit_of_measurement: "°F" # or "°C"
          mode: slider              # Options: "slider" or "box"
    default_heat_inactive_temp:
      name: Default Heat Inactive Temperature
      description: The desired target temperature when heating and inactive.
      default: 64
      selector:
        number:
          min: 60
          max: 75
          step: 1
          unit_of_measurement: "°F" # or "°C"
          mode: slider              # Options: "slider" or "box"
    default_heat_sleep_temp:
      name: Default Heat Sleeping Temperature
      description: The desired target temperature when heating and sleeping.
      default: 66
      selector:
        number:
          min: 60
          max: 75
          step: 1
          unit_of_measurement: "°F" # or "°C"
          mode: slider              # Options: "slider" or "box"
    default_cool_active_temp:
      name: Default Cool Active Temperature
      description: The desired target temperature when cooling and active.
      default: 76
      selector:
        number:
          min: 70
          max: 85
          step: 1
          unit_of_measurement: "°F" # or "°C"
          mode: slider              # Options: "slider" or "box"
    default_cool_inactive_temp:
      name: Default Cool Inactive Temperature
      description: The desired target temperature when cooling and inactive.
      default: 80
      selector:
        number:
          min: 70
          max: 85
          step: 1
          unit_of_measurement: "°F" # or "°C"
          mode: slider              # Options: "slider" or "box"
    default_cool_sleep_temp:
      name: Default Cool Sleeping Temperature
      description: The desired target temperature when cooling and sleeping.
      default: 78
      selector:
        number:
          min: 70
          max: 85
          step: 1
          unit_of_measurement: "°F" # or "°C"
          mode: slider              # Options: "slider" or "box"
mode: queued
max: 10

triggers:
  # Current temperatur of target climate changes at least for 60s.
  - trigger: state
    entity_id: !input target_climate
    attribute: current_temperature
    id: current_temp_changed
    for:
      seconds: 60
  # Outdoor temperature sensor changes for 60s
  - trigger: state
    entity_id: !input outdoor_temp_sensor
    id: outdoor_temp_changed
    to: null
    for:
      seconds: 60
  # The mode is changed
  - trigger: state
    entity_id: !input hvac_mode_select
    to: null
  # When people state changes for at least 60s
  - trigger: state
    entity_id: !input home_persons
    to: null
    for:
      seconds: 60
  # Required entities change state
  - trigger: state
    to: null
    entity_id: !input required_entities
  # Active entities change state
  - trigger: state
    to: null
    entity_id: !input active_entities
  # Sleeping sensors change state
  - trigger: state
    to: null
    entity_id: !input sleeping_sensors
  - triggers: !input other_trigger

condition:
  # Only run if triggered by not current_temp_changed or if target_temp_action is enabled
  # if current_temp_changed but Auto, then automatino does nto run
  - condition: template
    value_template: "{{ trigger.id != 'current_temp_changed' or target_temp_action != 'Auto' }}"

actions:
  - alias: "Throttle: Wait if last triggered less than 60 seconds ago"
    if:
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is not none and 
             (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered)) < 60 }}
    then:
      - delay:
          seconds: >-
            {{ (60 - as_timestamp(now()) + as_timestamp(this.attributes.last_triggered))|round(0) }}
  - alias: "Inputs"
    variables:
      is_guest_supported: !input enable_guest
      outdoor_temp_sensor: !input outdoor_temp_sensor
      hvac_mode_select: !input hvac_mode_select
      hot_weather_temp_entity: !input hot_weather_temp
      cold_weather_temp_entity: !input cold_weather_temp
      home_persons: !input home_persons
      target_climate: !input target_climate
      active_entities: !input active_entities
      required_entities: !input required_entities
      hvac_active_heat_temp: !input default_heat_active_temp
      hvac_active_cool_temp: !input default_cool_active_temp
      hvac_inactive_heat_temp: !input default_heat_inactive_temp
      hvac_inactive_cool_temp: !input default_cool_inactive_temp
      hvac_sleep_heat_temp: !input default_heat_sleep_temp
      hvac_sleep_cool_temp: !input default_cool_sleep_temp
      target_temp_action: !input target_temp_action
      target_temp_action_buffer: !input target_temp_action_buffer
      enable_temp_action_sleep: !input enable_temp_action_sleep
      sleeping_sensors: !input sleeping_sensors
  - alias: "Static Variables"
    variables:
      default_unknown_temp: 72
  - alias: "Dynamic Variables"
    variables:
      current_temp: "{{ state_attr(target_climate, 'current_temperature') | float(default_unknown_temp) }}"
      current_target_temp: "{{ state_attr(target_climate, 'temperature') | float(default_unknown_temp) }}"
      current_state: "{{ states(target_climate) }}"
      outdoor_temp: "{{ states(outdoor_temp_sensor)|float(default_unknown_temp) }}"
      people_home: >
        {{ home_persons | select('is_state', 'home') | map('state_attr', 'friendly_name') | map('lower') | list }}
      on_required_entities: >-
        {{ required_entities | select('is_state', 'on') | list }}
      on_active_entities: >-
        {{ active_entities | select('is_state', 'on') | list }}
      active_entity_labels: >-
        {{ on_active_entities | map('labels') | sum(start=[]) | map('lower') | list }}
      active_people: >-
        {{ active_entity_labels | select('in', people_home) | list }}
      is_active: >-
        {{ (on_required_entities|length>0 and active_people|length>0) or states(hvac_mode_select) == 'Home' }}
      on_sleep_entities: >-
        {{ sleeping_sensors | select('is_state', 'on') | list }}
      sleep_entity_labels: >-
        {{ on_sleep_entities | map('labels') | sum(start=[]) | map('lower') | list }}
      sleep_people: >-
        {{ sleep_entity_labels | select('in', people_home) | list }}
      is_sleeping: >-
        {{ sleep_people|length >0 or states(hvac_mode_select) == 'Sleep' }}
      desired_hvac_mode: >-
        {% if outdoor_temp > states(hot_weather_temp_entity)|float(default_unknown_temp) %}
          cool
        {% elif outdoor_temp < states(cold_weather_temp_entity)|float(default_unknown_temp) %}
          heat
        {% else %}
          mid
        {% endif %}
      desired_fan_mode: noop
      # mode is based on the following
      # 1. if guest or manual or (outdoor temp changed but current mode and desired mode are the same); then noop or no changes
      # 2. If select input is off; then off
      # 3. if at least one sleeping sensor on or hvac mode is sleep; sleep
      # 4. if at least one required sensor is on and at least one active sensor is on; then active
      # otherwise inactive
      initial_desired_state: >-
        {% if (trigger.id in ['outdoor_temp_changed'] and desired_hvac_mode == current_state) or (is_guest_supported and states(hvac_mode_select) == 'Guest') or states(hvac_mode_select) == 'Manual' %}
          noop
        {% elif is_state(hvac_mode_select,'Off') %}
          off
        {% elif is_sleeping %}
          sleep
        {% elif is_active %}
          active
        {% else %}
          inactive
        {% endif %}
      desired_target_temp: >-
        {% if desired_hvac_mode == 'heat' %}
          {% if initial_desired_state == 'sleep' %}
            {{ hvac_sleep_heat_temp }}
          {% elif initial_desired_state == 'active' %}
            {{ hvac_active_heat_temp }}
          {% else %}
            {{ hvac_inactive_heat_temp }}
          {% endif %}
        {% elif desired_hvac_mode == 'cool' %}
          {% if initial_desired_state == 'sleep' %}
            {{ hvac_sleep_cool_temp }}
          {% elif initial_desired_state == 'active' %}
            {{ hvac_active_cool_temp }}
          {% else %}
            {{ hvac_inactive_cool_temp }}
          {% endif %}
        {% else %}
          {{ default_unknown_temp }}
        {% endif %} 
      # override based on other modes
      # if turn off when target temp is reached and new mode is matching existing mode and triggered by current temp
      # and current_target_temp is equals desired_target_temp
      #   if heating and current > target; then off
      #   if cooling and current < target; then off
      #   otherwise, continue
      override_desired_state: >-
        {% if target_temp_action == 'Turn Off'
          and current_state in ['off', desired_hvac_mode]
          and (enable_temp_action_sleep or not is_sleeping)
          and desired_target_temp == current_target_temp
          and (
            (desired_hvac_mode == 'heat' and current_temp > (current_target_temp + target_temp_action_buffer))
              or (desired_hvac_mode == 'cool' and current_temp < (current_target_temp - target_temp_action_buffer))
          ) %}
          off
        {% else %}
          none
        {% endif %}
      desired_state: "{{ initial_desired_state if override_desired_state == 'none' else override_desired_state }}"

  - if:
      - condition: template
        value_template: >-
          {{ target_climate is defined and target_climate != '' and desired_state != 'noop' }}
    then:
      - choose:
          # --- OFF MODE ---
          - alias: "Off"
            conditions:
              - condition: template
                value_template: "{{ desired_state == 'off' }}"
            sequence:
              - action: climate.set_hvac_mode
                alias: Turn off
                target:
                  entity_id: "{{ target_climate }}"
                data:
                  hvac_mode: "off"

          # --- SLEEP MODE ---
          - alias: Sleep
            conditions:
              - condition: template
                value_template: "{{ desired_state == 'sleep' }}"
                alias: Anyone sleeping
            sequence:
              - choose:
                  # Cooling
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'cool' }}"
                    sequence:
                      - action: climate.set_temperature
                        alias: Cool to desired sleep
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          temperature: "{{ desired_target_temp }}"
                          hvac_mode: "{{ desired_hvac_mode }}"
                  # Mid
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'mid' }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        alias: Sleeping fan
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          hvac_mode: fan_only
                        enabled: true
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'heat' }}"
                    sequence:
                      - action: climate.set_temperature
                        alias: Heat to desired sleep
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          temperature: "{{ desired_target_temp }}"
                          hvac_mode: "{{ desired_hvac_mode }}"
                enabled: true
              - if:
                - condition: template
                  value_template: >-
                    {{ desired_fan_mode != 'noop' }}
                then:
                  - action: climate.set_fan_mode
                    alias: Setting fan mode
                    target:
                      entity_id: "{{ target_climate }}"
                    data:
                      fan_mode: "{{ desired_fan_mode }}"

          # --- INACTIVE MODE ---
          - alias: Inactive
            conditions:
              - condition: template
                value_template: "{{ desired_state == 'inactive' }}"
                alias: Inactive
            sequence:
              - choose:
                  # Cool
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'cool' }}"
                    sequence:
                      - action: climate.set_temperature
                        alias: Cool to desired inactive
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          temperature: "{{ desired_target_temp }}"
                          hvac_mode: "{{ desired_hvac_mode }}"
                  # Mid
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'mid' }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        alias: Inactive off
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          hvac_mode: "off"
                        enabled: true
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'heat' }}"
                    sequence:
                      - action: climate.set_temperature
                        alias: Heat to desired inactive
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          temperature: "{{ desired_target_temp }}"
                          hvac_mode: "{{ desired_hvac_mode }}"
                enabled: true
              - if:
                - condition: template
                  value_template: >-
                    {{ desired_fan_mode != 'noop' }}
                then:
                  - action: climate.set_fan_mode
                    alias: Setting fan mode
                    target:
                      entity_id: "{{ target_climate }}"
                    data:
                      fan_mode: "{{ desired_fan_mode }}"

          # --- ACTIVE MODE ---
          - alias: Active
            conditions:
              - condition: template
                value_template: "{{ desired_state == 'active' }}"
                alias: Active
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'cool' }}"
                    sequence:
                      - action: climate.set_temperature
                        alias: Cool to preferred active
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          temperature: "{{ desired_target_temp }}"
                          hvac_mode: "{{ desired_hvac_mode }}"
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'mid' }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        alias: Mid
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          hvac_mode: "off"
                        enabled: true
                  - conditions:
                      - condition: template
                        value_template: "{{ desired_hvac_mode == 'heat' }}"
                    sequence:
                      - action: climate.set_temperature
                        alias: Heat to preferred active
                        target:
                          entity_id: "{{ target_climate }}"
                        data:
                          temperature: "{{ desired_target_temp }}"
                          hvac_mode: "{{ desired_hvac_mode }}"
                enabled: true
              - if:
                - condition: template
                  value_template: >-
                    {{ desired_fan_mode != 'noop' }}
                then:
                  - action: climate.set_fan_mode
                    alias: Setting fan mode
                    target:
                      entity_id: "{{ target_climate }}"
                    data:
                      fan_mode: "{{ desired_fan_mode }}"
