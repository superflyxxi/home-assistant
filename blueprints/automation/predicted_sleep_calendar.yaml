blueprint:
  name: Sleeping Tracker & Prediction Calendar
  description: >
    Logs actual sleep sessions when waking up and generates 10th percentile sleep predictions
    for tonight/today, using a hashed entity ID prefix and proper local timezone handling.
  domain: automation
  input:
    sleeping_sensor:
      name: Sleeping Entity
      description: The binary sensor or state entity that turns ON when sleeping and OFF when awake.
      selector:
        entity: {}
    target_calendar:
      name: Target Calendar
      description: The shared calendar entity where actual and predicted sleep events will be stored.
      selector:
        entity:
          domain: calendar
    prediction_trigger:
      name: Prediction Trigger
      description: Any trigger like time of day or other schedule to run predictions.
      default: []
      selector:
        trigger: {}
    advanced:
      name: "Advanced"
      description: "Advanced settings"
      collapsed: true
      input:
        prediction_offset:
          name: Prediction Offset
          description: The amount of time to offset for predictions.
          default:
            hours: 0
            minutes: 10
          selector:
            duration:
              enable_day: false
              enable_second: false
              enable_millisecond: false

triggers:
  - platform: state
    entity_id: !input sleeping_sensor
    from: "on"
    to: "off"
    id: sleep_ended
  - triggers: !input prediction_trigger

action:
  - variables:
      sensor_entity: !input sleeping_sensor
      target_calendar: !input target_calendar
      prediction_offset: !input prediction_offset
      
      # Generate a short, unique 6-character hash from the entity ID using the md5 filter
      sensor_hash: "{{ (sensor_entity | md5)[:6] }}"
      
      actual_summary: "{{ 'Sleep [' ~ sensor_hash ~ '] - Actual' }}"
      predicted_summary: "{{ 'Sleep [' ~ sensor_hash ~ '] - Predicted' }}"

  # =========================================================================
  # BRANCH 1: LOG ACTUAL SLEEP SESSION (When waking up)
  # =========================================================================
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'sleep_ended' }}"
    then:
      - action: calendar.create_event
        target:
          entity_id: !input target_calendar
        data:
          summary: "{{ actual_summary }}"
          description: "Actual sleep logged automatically for entity: {{ sensor_entity }}"
          start_date_time: "{{ as_local(trigger.from_state.last_changed).isoformat() if trigger.from_state and trigger.from_state.last_changed else (now() - timedelta(hours=8)).isoformat() }}"
          end_date_time: "{{ now().isoformat() }}"

  # =========================================================================
  # BRANCH 2: RUN PREDICTION (When prediction_trigger fires)
  # =========================================================================
  - if:
      - condition: template
        value_template: "{{ trigger.id != 'sleep_ended' }}"
    then:
      - variables:
          t_date: "{{ now().strftime('%Y-%m-%d') }}"
          t_day: "{{ now().strftime('%A') }}"

      # Step 1: Fetch past 30 days of ACTUAL sleep events from calendar matching hashed prefix
      - action: calendar.get_events
        target:
          entity_id: !input target_calendar
        data:
          start_date_time: "{{ (now() - timedelta(days=30)).strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ now().strftime('%Y-%m-%d 23:59:59') }}"
        response_variable: past_events

      # Step 2: Calculate 10th percentile with weekday filter, 3-day fallback, and local timezone normalization
      - variables:
          calc: >
            {% set events = past_events[target_calendar].events if (past_events and target_calendar in past_events) else [] %}
            {% set actuals = events | selectattr('summary', 'eq', actual_summary) | list %}
            
            {# Try matching weekday first #}
            {% set day_on = namespace(values=[]) %}
            {% set day_off = namespace(values=[]) %}
            {% for e in actuals %}
              {% set start_dt = as_local(as_datetime(e.start)) %}
              {% set end_dt = as_local(as_datetime(e.end)) %}
              {% if start_dt and start_dt.strftime('%A') == t_day %}
                {% set day_on.values = day_on.values + [start_dt.hour * 3600 + start_dt.minute * 60 + start_dt.second] %}
                {% set day_off.values = day_off.values + [end_dt.hour * 3600 + end_dt.minute * 60 + end_dt.second] %}
              {% endif %}
            {% endfor %}
            
            {# Fallback to past 3 days if no data for this weekday #}
            {% if day_on.values | length == 0 %}
              {% set fb_on = namespace(values=[]) %}
              {% set fb_off = namespace(values=[]) %}
              {% set cutoff = now() - timedelta(days=3) %}
              {% for e in actuals %}
                {% set start_dt = as_local(as_datetime(e.start)) %}
                {% set end_dt = as_local(as_datetime(e.end)) %}
                {% if start_dt and start_dt >= cutoff %}
                  {% set fb_on.values = fb_on.values + [start_dt.hour * 3600 + start_dt.minute * 60 + start_dt.second] %}
                  {% set fb_off.values = fb_off.values + [end_dt.hour * 3600 + end_dt.minute * 60 + end_dt.second] %}
                {% endif %}
              {% endfor %}
              {% set final_on = fb_on.values %}
              {% set final_off = fb_off.values %}
            {% else %}
              {% set final_on = day_on.values %}
              {% set final_off = day_off.values %}
            {% endif %}
            
            {# --- 10th Percentile Bedtime (ON) --- #}
            {% if final_on | length > 0 %}
              {% set s_on = final_on | sort %}
              {% set idx_on = (((10 / 100) * (s_on | length - 1)) | round(0, 'common')) | int %}
              {% set idx_on = [0, [idx_on, s_on | length - 1] | min] | max %}
              {% set on_time = '%02d:%02d' | format(s_on[idx_on] // 3600, (s_on[idx_on] % 3600) // 60) %}
            {% else %}
              {% set on_time = '22:00' %}
            {% endif %}
            
            {# --- 10th Percentile Wake Time (OFF) --- #}
            {% if final_off | length > 0 %}
              {% set s_off = final_off | sort %}
              {% set idx_off = (((10 / 100) * (s_off | length - 1)) | round(0, 'common')) | int %}
              {% set idx_off = [0, [idx_off, s_off | length - 1] | min] | max %}
              {% set off_time = '%02d:%02d' | format(s_off[idx_off] // 3600, (s_off[idx_off] % 3600) // 60) %}
            {% else %}
              {% set off_time = '07:00' %}
            {% endif %}
            
            {{ {'on': on_time, 'off': off_time, 'samples': final_on | length} | to_json }}

          calc_res: "{{ (calc | string).strip() | from_json(default={'on':'22:00','off':'07:00','samples':0}) }}"

      # Step 3: Check if today's prediction already exists
      - action: calendar.get_events
        target:
          entity_id: !input target_calendar
        data:
          start_date_time: "{{ t_date ~ ' 00:00:00' }}"
          end_date_time: "{{ t_date ~ ' 23:59:59' }}"
        response_variable: tomorrow_events

      - variables:
          tomorrow_list: "{{ tomorrow_events[target_calendar].events | selectattr('summary', 'eq', predicted_summary) | list if tomorrow_events and target_calendar in tomorrow_events else [] }}"

      # Step 4: Write new Predicted Sleep event only if it doesn't already exist
      - if:
          - condition: template
            value_template: "{{ tomorrow_list | length == 0 }}"
        then:
          - action: calendar.create_event
            target:
              entity_id: !input target_calendar
            data:
              summary: "{{ predicted_summary }}"
              description: >
                Calculated dynamically from {{ calc_res.samples }} actual sleep calendar logs (weekday match or past 3-day fallback) for {{ t_day }}.
              start_date_time: >
                {% set raw_start = as_datetime(t_date ~ ' ' ~ calc_res.on ~ ':00') %}
                {% set offset = timedelta(hours=prediction_offset.get('hours', 0), minutes=prediction_offset.get('minutes', 0)) %}
                {{ (raw_start - offset).isoformat() }}
              end_date_time: >
                {% set on_h = calc_res.on.split(':')[0] | int %}
                {% set off_h = calc_res.off.split(':')[0] | int %}
                {% set base_end_date = (as_datetime(t_date ~ ' 00:00:00') + timedelta(days=1)).strftime('%Y-%m-%d') if (off_h <= on_h or calc_res.off < calc_res.on) else t_date %}
                {% set raw_end = as_datetime(base_end_date ~ ' ' ~ calc_res.off ~ ':00') %}
                {% set offset = timedelta(hours=prediction_offset.get('hours', 0), minutes=prediction_offset.get('minutes', 0)) %}
                {{ (raw_end - offset).isoformat() }}
