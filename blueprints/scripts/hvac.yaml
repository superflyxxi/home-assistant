active_heat_pump:
  domain: script
  name: Active Heat Pump
  author: SuperFlyXXI
sequence:
- choose:
  - conditions:
    - condition: state
      entity_id: weather.forecast_home
      state: unavailable
    sequence:
    - metadata: {}
      data:
        message: Forecast unknown
      action: notify.notify
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - condition: time
      after: '17:00:00'
    - alias: Cold forecast
      condition: numeric_state
      entity_id: sensor.forecasted_tommorrow_low_temperature
      below: input_number.cold_weather_temp
    sequence:
    - data:
        temperature: '{{ 67 + (heat_offset|default(0,true))}}'
        hvac_mode: heat
      target:
        entity_id: '{{target_entity_id}}'
      alias: Heat
      action: climate.set_temperature
    alias: Cold night forecast
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - alias: Cold forecast
      condition: numeric_state
      entity_id: sensor.forecasted_today_high_temperature
      below: input_number.cold_weather_temp
    sequence:
    - data:
        temperature: '{{ 67 + (heat_offset|default(0,true))}}'
        hvac_mode: heat
      target:
        entity_id: '{{target_entity_id}}'
      alias: Heat
      action: climate.set_temperature
    alias: Cold day forecast
  - conditions:
    - condition: template
      value_template: '{{ use_current_temp }}'
      alias: Use current temp
    - alias: Currently cold
      condition: numeric_state
      entity_id: sensor.current_temperature
      below: input_number.cold_weather_temp
    sequence:
    - data:
        temperature: '{{ 67 + (heat_offset|default(0,true))}}'
        hvac_mode: heat
      target:
        entity_id: '{{target_entity_id}}'
      alias: Heat
      action: climate.set_temperature
    alias: 'Currently cold '
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - condition: time
      after: '17:00:00'
    - alias: Hot forecast
      condition: numeric_state
      entity_id: sensor.forecasted_tommorrow_low_temperature
      above: input_number.hot_weather_temp
    sequence:
    - data:
        temperature: '{{ 77 + (cool_offset|default(0,true))}}'
        hvac_mode: cool
      target:
        entity_id: '{{target_entity_id}}'
      alias: Cool to 77
      action: climate.set_temperature
    alias: Hot night forecast
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - alias: Hot forecast
      condition: numeric_state
      entity_id: sensor.forecasted_today_high_temperature
      above: input_number.hot_weather_temp
    sequence:
    - data:
        temperature: '{{ 77 + (cool_offset|default(0,true))}}'
        hvac_mode: cool
      target:
        entity_id: '{{target_entity_id}}'
      alias: Cool to 77
      action: climate.set_temperature
    alias: Hot day forecast
  - conditions:
    - condition: template
      value_template: '{{ use_current_temp }}'
      alias: Use current temp
    - condition: numeric_state
      entity_id: sensor.current_temperature
      above: input_number.hot_weather_temp
    sequence:
    - data:
        temperature: '{{ 77 + (cool_offset|default(0,true))}}'
        hvac_mode: cool
      target:
        entity_id: '{{target_entity_id}}'
      alias: Cool to 77
      action: climate.set_temperature
    alias: Currently hot
  default:
  - data:
      hvac_mode: fan_only
    target:
      entity_id: '{{target_entity_id}}'
    alias: Fan
    action: climate.set_hvac_mode
mode: queued
icon: mdi:run
fields:
  heat_offset:
    selector:
      number:
        min: -10
        max: 10
        step: 1
    name: Heat offset
    default: 0
  cold_offset:
    selector:
      number:
        min: -10
        max: 10
        step: 1
    name: Cold offset
    default: 0
    required: false
  target_entity_id:
    selector:
      entity:
        multiple: true
    name: Target Entity ID
    required: true
  use_current_temp:
    selector:
      boolean: {}
    name: Use current temp
away_heat_pump:
alias: Away Heat Pump
sequence:
- choose:
  - conditions:
    - condition: state
      entity_id: weather.forecast_home
      state: unavailable
    sequence:
    - service: notify.notify
      metadata: {}
      data:
        message: Unavailable forecast
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - condition: time
      after: '17:00:00'
    - condition: numeric_state
      entity_id: sensor.forecasted_tommorrow_low_temperature
      below: input_number.cold_weather_temp
      alias: Cold low forecast
    sequence:
    - service: climate.set_temperature
      data:
        temperature: '{{ 63 + (heat_offset|default(0,true))}}'
        hvac_mode: heat
      target:
        entity_id: '{{target_entity_id}}'
      alias: Heat to 63
    alias: Evening cold low forecast
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - alias: Cold forecast
      condition: numeric_state
      entity_id: sensor.forecasted_today_high_temperature
      below: input_number.cold_weather_temp
    sequence:
    - service: climate.set_temperature
      data:
        temperature: '{{ 63 + (heat_offset|default(0,true))}}'
        hvac_mode: heat
      target:
        entity_id: '{{target_entity_id}}'
      alias: Heat to 63
    alias: Day cold forecast
  - conditions:
    - condition: template
      value_template: '{{ use_current_temp }}'
      alias: Use current temp
    - alias: Cold temp
      condition: numeric_state
      entity_id: sensor.current_temperature
      below: input_number.cold_weather_temp
    sequence:
    - service: climate.set_temperature
      data:
        temperature: '{{ 63 + (heat_offset|default(0,true))}}'
        hvac_mode: heat
      target:
        entity_id: '{{target_entity_id}}'
      alias: Heat to 63
    alias: 'Currently cold '
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - condition: time
      after: '17:00:00'
    - alias: Hot low forecast
      condition: numeric_state
      entity_id: sensor.forecasted_tommorrow_low_temperature
      above: input_number.hot_weather_temp
    sequence:
    - service: climate.set_temperature
      data:
        temperature: '{{ 80 + (cool_offset|default(0,true))}}'
        hvac_mode: cool
      target:
        entity_id: '{{target_entity_id}}'
      alias: Cool to 80
    alias: Evening hot low forecast
  - conditions:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ use_current_temp }}'
        alias: Use current temp
    - alias: Hot forecast
      condition: numeric_state
      entity_id: sensor.forecasted_today_high_temperature
      above: input_number.hot_weather_temp
    sequence:
    - service: climate.set_temperature
      data:
        temperature: '{{ 80 + (cool_offset|default(0,true))}}'
        hvac_mode: cool
      target:
        entity_id: '{{target_entity_id}}'
      alias: Cool to 80
    alias: Hot day forecast
  - conditions:
    - condition: template
      value_template: '{{ use_current_temp }}'
      alias: Use current temp
    - condition: numeric_state
      entity_id: sensor.current_temperature
      above: input_number.hot_weather_temp
    sequence:
    - service: climate.set_temperature
      data:
        temperature: '{{ 80 + (cool_offset|default(0,true))}}'
        hvac_mode: cool
      target:
        entity_id: '{{target_entity_id}}'
      alias: Cool to 80
    alias: Currently hot
  default:
  - service: climate.set_hvac_mode
    data:
      hvac_mode: fan_only
    target:
      entity_id: '{{target_entity_id}}'
    alias: Fan only
    enabled: true
mode: queued
icon: mdi:car
max: 10
fields:
  heat_offset:
    selector:
      number:
        min: -10
        max: 10
        step: 1
    name: Heat offset
    default: 0
  cold_offset:
    selector:
      number:
        min: -10
        max: 10
        step: 1
    name: Cold offset
    default: 0
    required: false
  target_entity_id:
    selector:
      entity:
        multiple: true
    name: Target Entity ID
    required: true
  use_current_temp:
    selector:
      boolean: {}
    name: Use current temp
hvac_automation:
alias: HVAC Automation
sequence:
- choose:
  - conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_select.hvac_automated
        state: Home
      - condition: and
        conditions:
        - condition: state
          entity_id: input_select.hvac_automated
          state: Auto
        - condition: or
          conditions:
          - condition: template
            value_template: '{{ is_state(schedule_entity_id, ''on'') }}'
            alias: Schedule is on
          - condition: and
            conditions:
            - condition: state
              entity_id: calendar.school_closings
              state: 'on'
            - condition: template
              value_template: '{{is_consider_school_closings}} '
              alias: Consider school closings
    sequence:
    - service: script.active_heat_pump
      data:
        target_entity_id: '{{target_entity_id}}'
        heat_offset: '{{heat_offset|default(0)}}'
        cool_offset: '{{cool_offset|default(0)}}'
        use_current_temp: '{{use_current_temp}}'
    alias: Active
  - conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_select.hvac_automated
        state: Away
      - condition: and
        conditions:
        - alias: Schedule is off
          condition: template
          value_template: '{{ is_state(schedule_entity_id, ''off'') }}'
        - condition: state
          entity_id: input_select.hvac_automated
          state: Auto
    sequence:
    - service: script.away_heat_pump
      data:
        target_entity_id: '{{target_entity_id}}'
        heat_offset: '{{heat_offset|default(0)}}'
        cool_offset: '{{cool_offset|default(0)}}'
        use_current_temp: '{{use_current_temp}}'
    alias: Away
  - conditions:
    - condition: state
      entity_id: input_select.hvac_automated
      state: 'Off'
    sequence:
    - service: climate.set_hvac_mode
      metadata: {}
      data:
        hvac_mode: 'off'
      target:
        entity_id: '{{target_entity_id}}'
      alias: Turn off
    alias: 'Off'
  enabled: true
mode: queued
fields:
  heat_offset:
    selector:
      number:
        min: -10
        max: 10
        step: 1
    name: Heat offset
    default: 0
  cold_offset:
    selector:
      number:
        min: -10
        max: 10
        step: 1
    name: Cold offset
    default: 0
    required: false
  target_entity_id:
    selector:
      entity:
        multiple: true
    name: Target Entity ID
    required: true
  schedule_entity_id:
    selector:
      entity:
        multiple: false
    name: Schedule Entity ID
    required: true
  use_current_temp:
    selector:
      boolean: {}
    name: 'Use current temp '
    default: false
  is_consider_school_closings:
    selector:
      boolean: {}
    name: Consider school closings
    default: true
hvac_timer_2:
alias: HVAC timer
sequence:
- condition: state
  entity_id: timer.hvac_timer
  state: idle
  enabled: true
- action: scene.create
  metadata: {}
  data:
    snapshot_entities:
    - input_select.hvac_automated
    scene_id: hvac_timer
- action: timer.start
  metadata: {}
  data:
    duration: '{{duration}}'
  target:
    entity_id: timer.hvac_timer
- action: input_select.select_option
  metadata: {}
  target:
    entity_id: input_select.hvac_automated
  data:
    option: '{{mode}}'
description: ''
fields:
  duration:
    selector:
      duration: {}
    required: true
    default:
      hours: 1
      minutes: 0
      seconds: 0
  mode:
    selector:
      state:
        entity_id: input_select.hvac_automated
    required: true
    default: Away
